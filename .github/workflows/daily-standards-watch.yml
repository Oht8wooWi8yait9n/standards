name: Daily NASA Standards Revision Watcher

on:
  schedule:
    # Run Monday through Friday at 12:00 UTC (8:00 AM EDT)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch-standards:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check watched standards for updates
        id: check_standards
        run: |
          python check_watched_standards.py

      - name: Create GitHub Issue Notification
        if: steps.check_standards.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 [Alert] NASA-STD-3001 Revision Update Detected" \
            --body-file alert_summary.md

      - name: Commit and push updated state
        if: steps.check_standards.outputs.changes_detected == 'true'
        run: |
          git config user.name "Aaron Sells"
          git config user.email "aaron.b.sells@nasa.gov"
          git add standards_watch.json
          git commit -m "chore(standards): update watched standards state [skip ci]"
          git push origin main
