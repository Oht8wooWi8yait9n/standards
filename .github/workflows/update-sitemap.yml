name: Update NASA Standards Sitemap

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NASA Standards Sitemap Generator
        run: |
          python generate_standards_sitemap.py

      - name: Check watched standards for updates
        id: check_standards
        run: |
          python check_watched_standards.py

      - name: Create GitHub Issue Notification
        if: steps.check_standards.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 [Alert] NASA-STD-3001 Revision Update Detected" \
            --body-file alert_summary.md

      - name: Commit and push updated sitemap
        run: |
          git config user.name "Aaron Sells"
          git config user.email "aaron.b.sells@nasa.gov"
          git add standards_sitemap.xml standards_urls.txt standards_watch.json
          if git diff --staged --quiet; then
            echo "No changes in NASA standards sitemap. Skipping commit."
          else
            git commit -m "chore(sitemap): weekly automated NASA standards synchronization [skip ci]"
            git push origin main
          fi
